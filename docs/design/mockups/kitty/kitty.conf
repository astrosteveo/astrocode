# The terminal the mockups are screenshotted in: the audit's font and cell size, no padding, no
# tab bar, so a 962x762 window is exactly 120x40 cells. The mockups paint every cell, so the theme
# only shows if one is missed.
font_family JetBrainsMono Nerd Font
font_size 10
modify_font cell_height 108%
window_padding_width 0
tab_bar_style hidden
cursor_blink_interval 0
cursor_trail 0
enable_audio_bell no
confirm_os_window_close 0
background #1a1b26
foreground #c0caf5
